name: Build sunfish kernel
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache cpio curl wget \
            flex git kmod libelf-dev libssl-dev lz4 python3 zip device-tree-compiler \
            binutils-aarch64-linux-gnu

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: abu-adm/android_kernel_google_msm-4.14
          ref: ksu-susfs-23.0
          path: kernel

      - name: Fetch AOSP Clang (r530567 - LOS 23 default)
        run: |
          mkdir -p toolchain/clang
          # Try the prebuilt tarballs in order of preference; first that works wins.
          CLANG_VERSIONS=(
            clang-r530567
            clang-r522817
            clang-r510928
          )
          SUCCESS=0
          for ver in "${CLANG_VERSIONS[@]}"; do
            URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel/${ver}.tar.gz"
            echo "Trying ${URL}"
            if wget -q --tries=2 --timeout=30 "${URL}" -O clang.tar.gz && [ -s clang.tar.gz ]; then
              if tar -xzf clang.tar.gz -C toolchain/clang 2>/dev/null && [ -x toolchain/clang/bin/clang ]; then
                echo "Got ${ver}"
                SUCCESS=1
                rm clang.tar.gz
                break
              fi
            fi
            rm -f clang.tar.gz
          done

          # Fallback: shallow-clone AOSP master-kernel (huge but reliable)
          if [ "$SUCCESS" != "1" ]; then
            echo "Tarball method failed, falling back to git clone (slow)"
            rm -rf toolchain/clang
            git clone --depth=1 -b main-kernel \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
              toolchain/clang-full
            # Pick the newest clang-r* dir
            LATEST=$(ls -d toolchain/clang-full/clang-r* 2>/dev/null | sort -V | tail -1)
            if [ -n "$LATEST" ]; then
              mv "$LATEST" toolchain/clang
              rm -rf toolchain/clang-full
            else
              echo "ERROR: no clang-r* directory found"
              exit 1
            fi
          fi

          test -x toolchain/clang/bin/clang || { echo "ERROR: clang binary missing"; ls -la toolchain/clang/bin/ 2>/dev/null; exit 1; }
          toolchain/clang/bin/clang --version

      - name: Fetch GCC stubs (for CROSS_COMPILE triplet)
        run: |
          for branch in lineage-22.2 lineage-22.1 lineage-21.0 lineage-19.1; do
            if git clone --depth=1 -b "$branch" \
              https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
              toolchain/aarch64 2>/dev/null; then
              echo "aarch64 GCC: $branch"
              break
            fi
          done
          for branch in lineage-22.2 lineage-22.1 lineage-21.0 lineage-19.1; do
            if git clone --depth=1 -b "$branch" \
              https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
              toolchain/arm 2>/dev/null; then
              echo "arm GCC: $branch"
              break
            fi
          done

      - name: Patch defconfig (KSU + SusFS + hardening)
        run: |
          tee -a kernel/arch/arm64/configs/sunfish_defconfig > /dev/null <<'EOF'
          # --- KernelSU (manual hooks, no kprobes) ---
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          # --- SusFS ---
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          # --- Security hardening ---
          CONFIG_AUDITSYSCALL=y
          CONFIG_UNMAP_KERNEL_AT_EL0=y
          CONFIG_MITIGATE_SPECTRE_BRANCH_HISTORY=y
          CONFIG_BPF_UNPRIV_DEFAULT_OFF=y
          # --- Disable Werror for newer Clang's stricter warnings ---
          # CONFIG_CC_WERROR is not set
          EOF
          sed -i 's/^          //' kernel/arch/arm64/configs/sunfish_defconfig
          echo "=== Last 40 lines of patched defconfig ==="
          tail -40 kernel/arch/arm64/configs/sunfish_defconfig

      - name: Build
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/aarch64/bin:$GITHUB_WORKSPACE/toolchain/arm/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/toolchain/clang/lib:$GITHUB_WORKSPACE/toolchain/clang/lib64:$LD_LIBRARY_PATH"
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=github-actions

          MAKE_ARGS=(
            O=out
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            STRIP=llvm-strip
            OBJDUMP=llvm-objdump
            READELF=llvm-readelf
            HOSTCC=clang
            HOSTCXX=clang++
            HOSTLD=ld.lld
            CROSS_COMPILE=aarch64-linux-android-
            CROSS_COMPILE_ARM32=arm-linux-androideabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            KCFLAGS=-Wno-error
          )

          make "${MAKE_ARGS[@]}" sunfish_defconfig

          echo "=== Verify KSU/SUSFS landed in .config ==="
          grep -E 'CONFIG_(KSU|SUSFS|AUDITSYSCALL|UNMAP_KERNEL_AT_EL0|MITIGATE_SPECTRE|CC_WERROR|BPF_UNPRIV)' out/.config || true

          make -j$(nproc) "${MAKE_ARGS[@]}" 2>&1 | tee build.log

      - name: Verify KSU is actually in the kernel binary
        if: always()
        run: |
          cd kernel
          for f in out/arch/arm64/boot/Image out/arch/arm64/boot/Image.lz4 out/arch/arm64/boot/Image.gz; do
            if [ -f "$f" ]; then
              echo "=== Strings in $f ==="
              strings "$f" 2>/dev/null | grep -iE 'ksu|susfs' | head -20 || true
            fi
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dts/google/*.dtb
            kernel/out/arch/arm64/boot/dts/google/*.dtbo
            kernel/build.log
          if-no-files-found: warn
          retention-days: 14


          
