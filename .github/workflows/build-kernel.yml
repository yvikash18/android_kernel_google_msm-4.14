name: Build sunfish KSU+SUSFS Kernel (LineageOS 23.0 / Android 16)

# Repo:    yvikash18/android_kernel_google_msm-4.14, branch ksu-susfs-23.0
# Device:  Google Pixel 4a (sunfish)
# Kernel:  Linux 4.14.356 + KernelSU-Next v1.1.1 + SUSFS v1.5.12
# Toolchain (from build.config.common in the kernel repo):
#   Clang: clang-r416183b  (AOSP S, ~Clang 12.0.5)
#   GCC:   aarch64-linux-android-4.9 + arm-linux-androideabi-4.9 (paths only; we use LLVM IAS, no GNU as)
#
# Fixes vs. v1:
#   * LLVM_IAS=1 -> use Clang's integrated assembler instead of GCC 4.9's `as`
#     (GCC 4.9 doesn't know -march=armv8.2-a+dotprod that this kernel uses).
#   * KCFLAGS adds -Wno-gnu-variable-sized-type-not-at-end -> SUSFS appends
#     fields after `struct cgroup cgrp` in cgroup-defs.h, which clang flags as
#     a GNU extension; the code is valid and the kernel treats warnings as errors.
#   * Export KSU_GIT_VERSION so the build doesn't print the "not defined" notice.

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Kernel source branch"
        required: true
        default: "ksu-susfs-23.0"
      build_variant:
        description: "Variant (default | no-cfi | performance)"
        required: true
        default: "default"
        type: choice
        options: [default, no-cfi, performance]

permissions:
  contents: read

env:
  KERNEL_REPO: yvikash18/android_kernel_google_msm-4.14
  KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch }}
  DEFCONFIG: sunfish_defconfig
  ARCH: arm64
  KBUILD_BUILD_USER: github-actions
  KBUILD_BUILD_HOST: ubuntu-builder

jobs:
  build:
    name: Build kernel image
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Maximize build disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache cpio \
            curl device-tree-compiler flex git kmod libelf-dev \
            libssl-dev lz4 python3 python3-pip rsync \
            unzip xz-utils zip zstd file
          # libtinfo5 is required by AOSP clang-r416183b on ubuntu-22.04
          curl -fsSL -o /tmp/libtinfo5.deb \
            http://launchpadlibrarian.net/666971015/libtinfo5_6.3-2ubuntu0.1_amd64.deb
          sudo dpkg -i /tmp/libtinfo5.deb || sudo apt-get -f install -y

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1
          submodules: false

      - name: Fetch Clang (clang-r416183b)
        run: |
          mkdir -p toolchain/clang
          git clone --depth=1 \
            https://gitlab.com/CalyxOS/platform_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            toolchain/clang
          test -x toolchain/clang/bin/clang
          toolchain/clang/bin/clang --version

      - name: Fetch GCC aarch64 (4.9, AOSP - paths only, LLVM IAS does the work)
        run: |
          git clone --depth=1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            toolchain/gcc-aarch64

      - name: Fetch GCC arm (4.9, AOSP, for 32-bit vDSO path resolution)
        run: |
          git clone --depth=1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            toolchain/gcc-arm

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-sunfish-${{ env.KERNEL_BRANCH }}-${{ github.sha }}
          restore-keys: |
            ccache-sunfish-${{ env.KERNEL_BRANCH }}-
            ccache-sunfish-
      - name: Configure ccache
        run: |
          ccache -M 5G
          ccache -z
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV

      - name: Verify kernel source layout
        working-directory: kernel
        run: |
          test -f Makefile
          grep -q '^VERSION = 4' Makefile
          grep -q '^PATCHLEVEL = 14' Makefile
          test -f arch/arm64/configs/${DEFCONFIG}
          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          echo "Kernel tree looks correct."

      - name: Build kernel
        working-directory: kernel
        run: |
          set -euxo pipefail
          export PATH="${GITHUB_WORKSPACE}/toolchain/clang/bin:${GITHUB_WORKSPACE}/toolchain/gcc-aarch64/bin:${GITHUB_WORKSPACE}/toolchain/gcc-arm/bin:${PATH}"
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/toolchain/clang/lib64:${LD_LIBRARY_PATH:-}"

          # KernelSU-Next: provide a synthetic git version so the build doesn't
          # complain. Format follows what KernelSU's own Makefile would produce
          # from `git rev-list --count HEAD` + 10200 (its base offset).
          export KSU_GIT_VERSION="$(git -C KernelSU-Next rev-list --count HEAD 2>/dev/null \
                                     | awk '{print 10200 + $1}' || echo 11000)"

          # Extra C flags forwarded to every clang invocation. The SUSFS-patched
          # cgroup-defs.h trips -Wgnu-variable-sized-type-not-at-end, which is
          # promoted to error by the kernel's -Werror.
          EXTRA_KCFLAGS="-Wno-gnu-variable-sized-type-not-at-end \
                         -Wno-error=gnu-variable-sized-type-not-at-end \
                         -Wno-unused-but-set-variable \
                         -Wno-misleading-indentation"

          MAKE_ARGS=(
            -j"$(nproc)"
            O=out
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC="ccache clang"
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            READELF=llvm-readelf
            HOSTCC=clang
            HOSTCXX=clang++
            HOSTAR=llvm-ar
            HOSTLD=ld.lld
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-android-
            CROSS_COMPILE_ARM32=arm-linux-androideabi-
            KCFLAGS=${EXTRA_KCFLAGS}
            KCPPFLAGS=${EXTRA_KCFLAGS}
          )

          # 1. defconfig
          make "${MAKE_ARGS[@]}" ${DEFCONFIG}

          # 2. variant tweaks
          case "${{ github.event.inputs.build_variant }}" in
            no-cfi)
              scripts/config --file out/.config \
                -d LTO -d LTO_CLANG -d CFI -d CFI_PERMISSIVE -d CFI_CLANG
              make "${MAKE_ARGS[@]}" olddefconfig
              ;;
            performance)
              scripts/config --file out/.config -d DEBUG_INFO
              make "${MAKE_ARGS[@]}" olddefconfig
              ;;
          esac

          # 3. confirm KSU + SUSFS
          grep -E '^CONFIG_KSU='       out/.config || echo "WARN: CONFIG_KSU not =y"
          grep -E '^CONFIG_KSU_SUSFS=' out/.config || echo "WARN: CONFIG_KSU_SUSFS not =y"

          # 4. build
          make "${MAKE_ARGS[@]}"

          ccache -s
          ls -lh out/arch/arm64/boot/
          strings out/include/generated/compile.h | grep -i linux_compiler || true

      - name: Collect artifacts
        working-directory: kernel
        run: |
          mkdir -p ../dist
          for f in Image Image.lz4 Image.lz4-dtb Image.gz Image.gz-dtb dtbo.img; do
            [ -f out/arch/arm64/boot/$f ] && cp -v out/arch/arm64/boot/$f ../dist/
          done
          cp -v out/.config ../dist/kernel-config-used
          cp -v out/include/generated/compile.h ../dist/compile.h || true

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sunfish-kernel-${{ github.event.inputs.build_variant }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
