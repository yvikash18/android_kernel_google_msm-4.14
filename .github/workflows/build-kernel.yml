name: Build sunfish kernel (LOS 22.1 + KSU-Next + SusFS)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Set CONFIG variable
        run: |
          echo "CONFIG=sunfish" >> $GITHUB_ENV

      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache cpio curl wget \
            flex git kmod libelf-dev libssl-dev lz4 python3 python-is-python3 \
            zip unzip rsync

      - name: Clone AnyKernel3, SusFS, kernel_patches
        run: |
          ANYKERNEL_BRANCH="non-gki"
          SUSFS_BRANCH="kernel-4.14"
          echo "Using AnyKernel3 branch: $ANYKERNEL_BRANCH"
          echo "Using SUSFS branch:      $SUSFS_BRANCH"
          git clone --depth=1 https://github.com/WildPlusKernel/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          git clone --depth=1 https://github.com/WildPlusKernel/kernel_patches.git

      - name: Clone kernel source (cabagekiller lineage-22.1)
        run: |
          mkdir -p "$CONFIG"
          cd "$CONFIG"
          git clone --depth=1 https://github.com/cabagekiller/android_kernel_google_msm-4.14 -b lineage-22.1
          ls -l

      - name: Add KernelSU-Next (next-susfs-dev)
        run: |
          cd "$CONFIG/android_kernel_google_msm-4.14"
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next-susfs/kernel/setup.sh" | bash -s next-susfs-dev

      - name: Apply SusFS patches
        run: |
          cd "$CONFIG/android_kernel_google_msm-4.14"
          # Bring in SusFS files
          cp ../../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch ./
          cp ../../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../../susfs4ksu/kernel_patches/include/linux/* ./include/linux/

          # Apply SusFS patch (fuzz allowed because of minor offsets)
          patch -p1 --fuzz=3 < 50_add_susfs_in_kernel-4.14.patch || true

          # fdinfo.c reconciliation (KSU + SusFS overlap fix)
          sed -i 's/^\(\s*\)u32 mask = mark->mask & IN_ALL_EVENTS;/\1\/\/u32 mask = mark->mask \& IN_ALL_EVENTS;/' ./fs/notify/fdinfo.c
          sed -i 's/inotify_mark_user_mask(mark));/mask, mark->ignored_mask);/' ./fs/notify/fdinfo.c
          sed -i '/if (likely(current->susfs_task_state \& TASK_STRUCT_NON_ROOT_USER_APP_PROC) \&\&/i \ \ \ \ u32 mask = mark->mask & IN_ALL_EVENTS;' ./fs/notify/fdinfo.c

      - name: Apply KSU manual-hook patch for 4.14
        run: |
          cd "$CONFIG/android_kernel_google_msm-4.14"
          cp ../../kernel_patches/next/next_hooks_4.14.patch ./
          patch -p1 --fuzz=3 < ./next_hooks_4.14.patch

      - name: Append KSU + SusFS + hardening configs to sunfish_defconfig
        run: |
          cd "$CONFIG/android_kernel_google_msm-4.14"
          DEFCONFIG="./arch/arm64/configs/sunfish_defconfig"

          # KernelSU-Next (manual hooks)
          cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_WITH_KPROBES=n
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          # Security hardening
          CONFIG_AUDITSYSCALL=y
          CONFIG_UNMAP_KERNEL_AT_EL0=y
          CONFIG_MITIGATE_SPECTRE_BRANCH_HISTORY=y
          CONFIG_BPF_UNPRIV_DEFAULT_OFF=y
          EOF

          # Convert any =m to =y (matches reference workflow)
          sed -i 's/=m/=y/g' "$DEFCONFIG"

          echo "=== Tail of patched defconfig ==="
          tail -40 "$DEFCONFIG"

      - name: Patch build configs (drop check_defconfig)
        run: |
          cd "$CONFIG/android_kernel_google_msm-4.14"
          sed -i 's/check_defconfig && //' ./build.config.sunfish_no-cfi

          # Localversion: brand the build
          sed -i '$s|echo "\$res"|echo "-yvikash18"|' ./scripts/setlocalversion
          sed -i 's/-dirty//' ./scripts/setlocalversion

          # Deterministic UTS_VERSION (avoids reproducibility nondeterminism)
          perl -pi -e 's{UTS_VERSION="\$\(echo \$UTS_VERSION \$CONFIG_FLAGS \$TIMESTAMP \| cut -b -\$UTS_LEN\)"}{UTS_VERSION="#1 SMP PREEMPT Thu May 15 00:00:00 UTC 2026"}' ./scripts/mkcompile_h

      - name: Build the kernel
        run: |
          cd "$CONFIG/android_kernel_google_msm-4.14"
          chmod +x ./build_sunfish.sh
          ./build_sunfish.sh 2>&1 | tee build.log

      - name: List build outputs
        if: always()
        run: |
          cd "$CONFIG/android_kernel_google_msm-4.14"
          echo "=== out/ tree (top 100) ==="
          find out -type f \( -name 'Image*' -o -name '*.dtb' -o -name 'dtbo.img' -o -name 'vmlinux' \) -ls | head -100 || true

      - name: Verify KSU is in the kernel binary
        if: always()
        run: |
          cd "$CONFIG/android_kernel_google_msm-4.14"
          KIMG=$(find out -name 'Image.lz4' | head -1)
          if [ -n "$KIMG" ]; then
            echo "=== KSU/SusFS strings in $KIMG ==="
            strings "$KIMG" 2>/dev/null | grep -iE 'ksu|susfs' | head -30 || \
              echo "WARNING: no KSU/SusFS strings found"
          else
            echo "WARNING: no Image.lz4 produced"
          fi

      - name: Upload raw kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ env.CONFIG }}
          path: |
            ${{ env.CONFIG }}/android_kernel_google_msm-4.14/out
            ${{ env.CONFIG }}/android_kernel_google_msm-4.14/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Pack into AnyKernel3 zip
        if: success()
        run: |
          cd "$CONFIG/android_kernel_google_msm-4.14"
          # Find the actual output paths
          KIMG=$(find out -name 'Image.lz4' | head -1)
          DTBO=$(find out -name 'dtbo.img' | head -1)
          if [ -z "$KIMG" ]; then
            echo "Image.lz4 not found, skipping AnyKernel3 packaging"
            exit 0
          fi
          cp "$KIMG"   "$GITHUB_WORKSPACE/AnyKernel3/Image.lz4"
          if [ -n "$DTBO" ]; then
            cp "$DTBO" "$GITHUB_WORKSPACE/AnyKernel3/dtbo.img"
          fi
          cd "$GITHUB_WORKSPACE/AnyKernel3"
          ZIP_NAME="AnyKernel3-sunfish-LOS22.1-KSU-Next-SUSFS.zip"
          zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" ./*
          echo "Built $ZIP_NAME"
          ls -la "$GITHUB_WORKSPACE/$ZIP_NAME"

      - name: Upload AnyKernel3 zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-${{ env.CONFIG }}
          path: AnyKernel3-sunfish-LOS22.1-KSU-Next-SUSFS.zip
          if-no-files-found: warn
          retention-days: 14
